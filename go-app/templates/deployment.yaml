apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-go-app
  labels:
    app: {{ .Release.Name }}-go-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}-go-app
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-go-app
    spec:
      containers:
        - name: go-app
          image: "go-app:latest"  # Use the local image tag
          imagePullPolicy: IfNotPresent  # Use local image if available, don’t pull
          ports:
            - containerPort: 8080
